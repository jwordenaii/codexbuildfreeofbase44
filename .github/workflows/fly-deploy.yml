name: Deploy to Fly

# Ships the backend to Fly.io (app: jworden-api).
#
# Two ways it runs:
#   - Automatically when backend code lands on main (app/, alembic/, Dockerfile,
#     fly.toml, requirements.txt, gunicorn.conf.py).
#   - On demand: the "Run workflow" button on the Actions tab (workflow_dispatch)
#     — no command line needed.
#
# Requires one repository secret: FLY_API_TOKEN (create it on the Fly dashboard
# under Account -> Access Tokens, then add it under GitHub repo Settings ->
# Secrets and variables -> Actions). Without the secret, the deploy is skipped
# with a clear message instead of failing.
#
# Builds on Fly's remote builders (--remote-only), so nothing needs Docker here.
# The migration runs via fly.toml's release_command before traffic shifts, and
# Fly only promotes a release that passes the /health check.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "Dockerfile"
      - "fly.toml"
      - "requirements.txt"
      - "gunicorn.conf.py"

concurrency:
  group: fly-deploy-jworden-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy jworden-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Fly token
        id: tok
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN secret is not set — skipping deploy. Add it under Settings -> Secrets and variables -> Actions to enable one-click deploys."
          fi

      - name: Set up flyctl
        if: steps.tok.outputs.have == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (remote build + release migration)
        if: steps.tok.outputs.have == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app jworden-api

      - name: Post-deploy health check
        if: steps.tok.outputs.have == 'true'
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -m 10 -o /dev/null -w "%{http_code}" https://jworden-api.fly.dev/health || true)
            echo "health attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::Backend did not return 200 from /health after deploy."
          exit 1
