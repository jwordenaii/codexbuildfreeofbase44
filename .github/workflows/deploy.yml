name: Deploy

# Runs automatically on every push to main.
# Can also be triggered manually from the Actions tab with optional environment override.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (production | preview)"
        required: false
        default: "production"

permissions:
  contents: read

# Only one deployment per branch runs at a time; newer run cancels the previous one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Front-end: build & deploy to Netlify ─────────────────────────────────────
  deploy-frontend:
    name: Deploy Front-End → Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Explicit deploy ownership model:
      # - git-integration: Netlify auto-builds from linked GitHub repo/branch.
      # - cli: this workflow publishes dist via Netlify CLI.
      NETLIFY_DEPLOY_MODE: ${{ vars.NETLIFY_DEPLOY_MODE || 'git-integration' }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Validate Netlify deploy mode
        id: deploy_mode
        run: |
          case "$NETLIFY_DEPLOY_MODE" in
            git-integration)
              echo "use_cli=false" >> "$GITHUB_OUTPUT"
              echo "::notice::NETLIFY_DEPLOY_MODE=git-integration. Netlify Git integration is the deploy source."
              ;;
            cli)
              if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
                echo "::error::NETLIFY_DEPLOY_MODE=cli requires NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets."
                exit 1
              fi
              echo "use_cli=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Invalid NETLIFY_DEPLOY_MODE '$NETLIFY_DEPLOY_MODE'. Use 'git-integration' or 'cli'."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Set up environment variables ───────────────────────────────────────
      - name: Bootstrap .env from .env.example
        run: cp .env.example .env

      # ── Install dependencies ───────────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      - name: Check required build variables
        run: |
          [ -n "$VITE_API_BASE_URL" ] || (echo "::error::Missing VITE_API_BASE_URL" && exit 1)
          [ -n "$VITE_SITE_URL" ] || (echo "::error::Missing VITE_SITE_URL" && exit 1)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://codexbuildfreeofbase44-production.up.railway.app' }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://www.jwordenasphaltpaving.com' }}

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build front-end
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://codexbuildfreeofbase44-production.up.railway.app' }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://www.jwordenasphaltpaving.com' }}
          VITE_GA4_ID: ${{ secrets.VITE_GA4_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_PLACE_ID: ${{ secrets.VITE_GOOGLE_PLACE_ID }}

      # ── Validate build output ──────────────────────────────────────────────
      - name: Validate dist/
        run: |
          [ -d dist ] || (echo "dist/ not found" && exit 1)
          [ -f dist/index.html ] || (echo "dist/index.html missing" && exit 1)
          echo "dist/ looks good:"
          ls -lh dist/

      # ── Upload build artifact ──────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      # ── Deploy to Netlify ──────────────────────────────────────────────────
      - name: Deploy to Netlify (production)
        if: steps.deploy_mode.outputs.use_cli == 'true' && github.event.inputs.environment != 'preview'
        run: npx netlify-cli deploy --dir=dist --prod

      - name: Deploy to Netlify (preview)
        if: steps.deploy_mode.outputs.use_cli == 'true' && github.event.inputs.environment == 'preview'
        run: npx netlify-cli deploy --dir=dist

  # ── Back-end: validate, test, build Docker ────────────────────────────────────
  deploy-backend:
    name: Deploy Back-End
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Bootstrap environment ──────────────────────────────────────────────
      - name: Bootstrap .env from .env.example
        run: cp .env.example .env

      # ── Install dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Verify app loads ───────────────────────────────────────────────────
      - name: Smoke-test app import
        run: python -c "from app.main import app; print('FastAPI app loaded OK')"
        env:
          JWORDEN_MASTER_KEY: ${{ secrets.JWORDEN_MASTER_KEY || 'ci-master-key' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-jwt-secret' }}
          AUTO_CREATE_TABLES: "true"

      # ── Database migrations ────────────────────────────────────────────────
      - name: Run Alembic migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./jworden_leads.db

      # ── Run pytest ────────────────────────────────────────────────────────
      - name: Run backend tests
        run: pytest -q tests/backend
        env:
          JWORDEN_MASTER_KEY: ${{ secrets.JWORDEN_MASTER_KEY || 'ci-master-key' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-jwt-secret' }}
          AUTO_CREATE_TABLES: "true"

      # ── Build production Docker image ─────────────────────────────────────
      - name: Build production Docker image
        run: docker build --target production -t jworden-backend:${{ github.sha }} .

      - name: Verify Gunicorn is installed in image
        run: |
          docker run --rm jworden-backend:${{ github.sha }} \
            gunicorn --version

  # ── Integration: start both services and run E2E tests ───────────────────────
  integration-tests:
    name: Integration & E2E Tests
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Frontend unit tests
        run: npm run test:unit --if-present

      - name: Backend API tests
        run: pytest -q tests/backend
        env:
          JWORDEN_MASTER_KEY: ${{ secrets.JWORDEN_MASTER_KEY || 'ci-master-key' }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-jwt-secret' }}
          AUTO_CREATE_TABLES: "true"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (frontend ↔ mock backend)
        run: npm run test:e2e --if-present
        env:
          VITE_API_BASE_URL: http://127.0.0.1:9999
          VITE_CC_PASSWORD: e2e-pin
