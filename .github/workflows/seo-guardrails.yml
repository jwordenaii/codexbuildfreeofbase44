name: SEO Guardrails

on:
  push:
    branches: [main]
    paths:
      - "public/sitemap.xml"
      - "public/sitemap.txt"
      - "public/image-sitemap.xml"
      - "public/sitemap-thewordenstandard.xml"
      - "public/robots.txt"
      - "public/_redirects"
      - "obx-paving/public/sitemap.xml"
      - "obx-paving/public/robots.txt"
      - "obx-paving/netlify.toml"
      - "src/lib/landingPages.js"
      - "src/components/SEO.jsx"
      - "scripts/verify-sitemap-safety.mjs"
      - "scripts/repo-preflight.ps1"
      - "scripts/seo-guardrails.ps1"
      - "scripts/seo-self-heal.ps1"
      - "netlify.toml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "public/sitemap.xml"
      - "public/sitemap.txt"
      - "public/image-sitemap.xml"
      - "public/sitemap-thewordenstandard.xml"
      - "public/robots.txt"
      - "public/_redirects"
      - "obx-paving/public/sitemap.xml"
      - "obx-paving/public/robots.txt"
      - "obx-paving/netlify.toml"
      - "src/lib/landingPages.js"
      - "src/components/SEO.jsx"
      - "scripts/verify-sitemap-safety.mjs"
      - "scripts/repo-preflight.ps1"
      - "scripts/seo-guardrails.ps1"
      - "scripts/seo-self-heal.ps1"
      - "netlify.toml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: SEO Schema + Sitemap Guardrails
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sitemap safety guard
        shell: bash
        run: node scripts/verify-sitemap-safety.mjs

      - name: Run SEO guardrails
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/seo-guardrails.ps1 -MaxAgeDays 45
