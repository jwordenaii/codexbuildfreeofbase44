# Fly.io config for the JWordenAI backend (app: jworden-api).
#
# This mirrors the LIVE deployed configuration (pulled via `fly config show`)
# so a deploy preserves the exact topology:
#   - three process groups: app (web), worker (celery), beat (celery scheduler)
#   - per-process VM sizes (app 1gb, worker 1gb, beat 512mb)
#   - http_service bound to the `app` process only
#
# The ONLY addition vs. the live config is [deploy].release_command, so the
# database migration (alembic upgrade head) runs automatically before traffic
# shifts instead of being applied by hand. A failed release_command aborts the
# deploy without shifting traffic, so it cannot cause an outage.
#
# App-level Fly *secrets* (ANTHROPIC_API_KEY, DATABASE_URL, JWORDEN_MASTER_KEY,
# STRIPE_*, etc.) live on the app and are NOT in this file — they persist
# across deploys and are unaffected by it.

app = "jworden-api"
primary_region = "iad"

[build]

[deploy]
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"

[processes]
  app = "sh -c 'gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:${PORT:-8000} app.main:app'"
  beat = "celery -A app.celery_app:celery_app beat --loglevel=info"
  worker = "celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["beat"]
