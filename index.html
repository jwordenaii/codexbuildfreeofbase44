<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" />

    <!-- Google tag placeholder — replace GA_MEASUREMENT_ID with your actual ID -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
    </script>

    <!-- Primary SEO — React SEO component fills these dynamically per page -->
    <title>OBX Paving Co. | Asphalt Paving &amp; Sealcoating — Outer Banks, NC</title>
    <link rel="canonical" href="https://www.obxpaving.com/" />
    <meta name="description"
      content="Premium asphalt paving and sealcoating for the Outer Banks of North Carolina. Serving Kill Devil Hills, Nags Head, Kitty Hawk, Duck, Corolla, Manteo and all of Dare County. Licensed &amp; insured." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B1D35" />

    <!-- Geo -->
    <meta name="geo.region" content="US-NC" />
    <meta name="geo.placename" content="Kill Devil Hills, North Carolina" />
    <meta name="geo.position" content="35.9957;-75.6243" />
    <meta name="ICBM" content="35.9957, -75.6243" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OBX Paving Co." />
    <meta property="og:title" content="OBX Paving Co. | Outer Banks Asphalt &amp; Sealcoating" />
    <meta property="og:description"
      content="Premium asphalt paving and sealcoating for the Outer Banks of North Carolina. Licensed, insured, and local." />
    <meta property="og:url" content="https://www.obxpaving.com/" />
    <meta property="og:image" content="/og-default.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OBX Paving Co. | Outer Banks Asphalt &amp; Sealcoating" />
    <meta name="twitter:description"
      content="Premium asphalt paving and sealcoating for the Outer Banks of NC. Licensed &amp; insured." />
    <meta name="twitter:image" content="/og-default.jpg" />

    <!-- LocalBusiness JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["PavingContractor", "LocalBusiness"],
      "name": "OBX Paving Co.",
      "image": "/og-default.jpg",
      "url": "https://www.obxpaving.com/",
      "telephone": "+1-252-555-0140",
      "email": "info@obxpaving.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kill Devil Hills",
        "addressRegion": "NC",
        "postalCode": "27948",
        "addressCountry": "US"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 35.9957,
        "longitude": -75.6243
      },
      "areaServed": [
        { "@type": "City", "name": "Kill Devil Hills" },
        { "@type": "City", "name": "Nags Head" },
        { "@type": "City", "name": "Kitty Hawk" },
        { "@type": "City", "name": "Duck" },
        { "@type": "City", "name": "Corolla" },
        { "@type": "City", "name": "Manteo" },
        { "@type": "AdministrativeArea", "name": "Dare County" },
        { "@type": "AdministrativeArea", "name": "Currituck County" }
      ],
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
        "opens": "07:00",
        "closes": "17:00"
      }]
    }
    </script>
