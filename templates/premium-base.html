<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ENTITY_NAME}} | {{H1}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <link rel="canonical" href="https://{{ENTITY_DOMAIN}}/">
  <style>
    :root {
      --brand-primary: {{BRAND_PRIMARY}};
      --brand-accent: {{BRAND_ACCENT}};
      --font-stack: {{FONT_STACK}};
    }
    body { font-family: var(--font-stack); margin: 0; color: #222; }
    main { max-width: 980px; margin: 0 auto; padding: 1rem; }
    .cta-button {
      display: inline-block;
      background: var(--brand-primary);
      color: #fff;
      text-decoration: none;
      padding: 0.7rem 1.2rem;
      border-radius: 6px;
      font-weight: 700;
    }
    .cta-button:hover { background: var(--brand-accent); color: #111; }
  </style>
  <script type="application/ld+json">{{SCHEMA_JSON_LD}}</script>
</head>
<body>
  <header>
    <main>
      <h1>{{ENTITY_NAME}}</h1>
      <p>{{PHONE_DISPLAY}}</p>
      <p>{{ADDRESS_SINGLE_LINE}}</p>
    </main>
  </header>

  <main>
    <h2>{{H1}}</h2>
    <section id="portfolio">
      {{PORTFOLIO_SECTIONS}}
    </section>
    <section id="service-areas">
      <h3>Service Areas</h3>
      <ul>{{SERVICE_AREA_LIST}}</ul>
    </section>
    <p><a href="{{PRIMARY_CTA_HREF}}" class="cta-button">{{PRIMARY_CTA_TEXT}}</a></p>
  </main>
</body>
</html>
